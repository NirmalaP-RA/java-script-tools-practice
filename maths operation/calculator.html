<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<style>
    .Calculator{
        width: 300px;
        border: 1px solid black;
        background-color: aqua;
        margin: auto;
    }
     tr{
        display:flex;
      align-items: center;
      margin: 10px;
      padding: 5px;
     }
</style>
<body>
    <div class="Calculator">
    <table>
        <tr>
            <td>number1</td>
            <td> <input type="text" id="num1"></td>
        </tr>
        <tr>
            <td>Operations</td>
            <td> 
                <select name="" id="Operations">
                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button onclick="simpleCal()">Save</button>
            </td>
        </tr>
        <tr>
            <td>number2</td>
            <td> <input type="text" id="num2"></td>
        </tr>
        <tr>
            <td>Result</td>
            <td> <input type="text" id="Result"></td>
        </tr>
    </table>
</div>
</body>
<script>
    // get data
    var num1=document.getElementById("num1")
    var opr=document.getElementById("Operations");
    var num2=document.getElementById("num2")
    var Result=document.getElementById("Result")

    function simpleCal(){
    //  set data using switch case
    var outputValue;
    console.log(opr.value);
    switch(opr.value){
        case"+":
        outputValue=Number(num1.value)+ Number(num2.value) ;
        break;
        case"-":
        outputValue=Number(num1.value)- Number(num2.value) ;
        break;
        case"*":
        outputValue=Number(num1.value)* Number(num2.value) ;
        break;
        case"/":
        outputValue=Number(num1.value)/ Number(num2.value) ;
        break;
        default:
        break;
            
    }
    Result.value= outputValue;
    
    }

</script>
</html>
