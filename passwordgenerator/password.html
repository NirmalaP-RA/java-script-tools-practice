<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="../passwordgenerator/style.css">
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
     <h2>Password Generator</h2>
        <div class="result-container">
        <span id="result"></span>
        <button class="btn" id="clipboard">
            <i class="far fa-clipboard"></i>
        </button>
        </div>

        <div class="settings">
            <div class="setting">
                <label for="">Password Length</label>
                <input type="number" id="length" min="4" max="20" value="20">
            </div>
            <div class="setting">
             <label for="">Include UpperCase Letter</label>
             <input type="checkbox" checked="">
            </div>
            <div class="setting">
                <label for="">Include lowerCase Letter</label>
                <input type="checkbox" checked="">
            </div>
            <div class="setting">
                <label for="">Include numbers</label>
                <input type="checkbox" checked="">
            </div>
            <div class="setting">
                <label for="">Include symbols</label>
                <input type="checkbox" checked="">
            </div>
        </div>
        <button class="btn btn-large" id="generate">
           Generate Password
        </button>
    </div>
</body>
 <script src="./app.js"></script>
</html>
